# main tarmog‘iga push qilinganda va har dushanba: rasmiy maʼlumotlarni yangilash → build → GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"   # har dushanba 03:00 UTC — agentliklar, viza, kurslar yangilanadi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # gov.uz va xorijdaish.uz dan yangi maʼlumot; manba ishlamasa repo’dagi nusxa qoladi
      - run: npm run data
        continue-on-error: true
      - run: npm run i18n          # tillar faylini tekshirish (xato bo‘lsa deploy to‘xtaydi)
      - run: npm run build
        env:
          BASE: /safar-uzbekistan/
          VITE_OWM_KEY: ${{ secrets.VITE_OWM_KEY }}
          VITE_STATS_URL: ${{ secrets.VITE_STATS_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
